<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<title>বিকাশ বনাম বাংলা QR</title>
<style>
@font-face{font-family:Baloo;font-weight:800;src:url(assets/fonts/baloo-da-2-bengali-800-normal.woff2)}
@font-face{font-family:Baloo;font-weight:800;src:url(assets/fonts/baloo-da-2-latin-800-normal.woff2);unicode-range:U+0000-00FF}

@font-face{font-family:Anek;font-weight:800;src:url(assets/fonts/anek-bangla-bengali-800-normal.woff2)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Hind,sans-serif}
.scene{position:absolute;inset:0;overflow:hidden;display:none}
.scene.cream{background:radial-gradient(120% 80% at 30% 20%,#fbf7ea 0%,#f1e9d0 60%,#e6dcbc 100%);color:#121212;--fg:#121212;--ac:#e0102a;--ac2:#0b7a35;--line:rgba(0,0,0,.16);--wm:rgba(0,0,0,.055);--sub:#5d5541}
.scene.green{background:radial-gradient(120% 90% at 30% 15%,#16934a 0%,#0b6f31 55%,#064d21 100%);color:#fff;--fg:#fff;--ac:#ffc93c;--ac2:#ffc93c;--line:rgba(255,255,255,.22);--wm:rgba(255,255,255,.07);--sub:#cfe9d6}
.scene.black{background:radial-gradient(110% 80% at 50% 25%,#1d1d1f 0%,#0c0c0d 60%,#050505 100%);color:#fff;--fg:#fff;--ac:#ffc414;--ac2:#ff2a3d;--line:rgba(255,255,255,.18);--wm:rgba(255,255,255,.06);--sub:#a9a9b0}
.scene.yellow{background:radial-gradient(120% 90% at 30% 15%,#ffd23f 0%,#f6b915 55%,#e39f08 100%);color:#121212;--fg:#121212;--ac:#d10f24;--ac2:#121212;--line:rgba(0,0,0,.18);--wm:rgba(0,0,0,.07);--sub:#5a4206}
.scene::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 70px,transparent 70px 140px);pointer-events:none}
.scene.cream::after{content:"";position:absolute;right:30px;top:140px;width:330px;height:260px;background-image:radial-gradient(rgba(0,0,0,.13) 2.5px,transparent 3px);background-size:26px 26px;pointer-events:none}

.hdr{position:absolute;left:60px;right:60px;top:52px;height:60px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--line);font:700 26px Hind;letter-spacing:4px;color:var(--fg)}
.hdr .b::before{content:"";display:inline-block;width:14px;height:14px;border-radius:50%;background:#f39200;margin-right:14px;vertical-align:2px}
.hdr .n{letter-spacing:2px;opacity:.8}
.wm{position:absolute;right:-30px;bottom:-170px;font:800 560px/1 Baloo;color:var(--wm);pointer-events:none}
.foot{position:absolute;left:0;right:0;top:1680px;text-align:center;color:var(--fg);opacity:.9}
.foot .w{font:400 58px Georgia,"DejaVu Serif",serif;letter-spacing:1px}
.foot .w i{color:#f39200;font-style:normal}
.foot .t{font:500 22px Hind;opacity:.6;margin-top:-4px}

.a{position:absolute;will-change:transform,opacity}
.h{font:800 112px/1.18 Baloo;color:var(--fg);white-space:nowrap}
.h em{font-style:normal;color:var(--ac)}
.h u{text-decoration:none;color:var(--ac2)}
.pill{display:inline-block;padding:10px 34px 4px;border-radius:60px;font:800 52px/1.25 Baloo;white-space:nowrap}
.pill.y{background:#ffc414;color:#111;border:4px solid #111}
.pill.k{background:#111;color:#ffc414}
.pill.w{background:#fff;color:#111;border:4px solid #111}
.pill.r{background:#e0102a;color:#fff}
.pill.g{background:#0b7a35;color:#fff}
.card{background:#fff;border:8px solid #111;border-radius:34px;box-shadow:16px 16px 0 #111}
.big{font:800 220px/1.1 Baloo;white-space:nowrap;text-align:center}
.tile{width:250px;height:250px;padding:16px}
.tile .in{width:100%;height:100%;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font:800 66px/1.1 Baloo}
.tile .in small{font:700 30px Hind;opacity:.9}
.row{display:flex;align-items:center;gap:28px;padding:22px 30px;width:960px}
.row .num{font:800 96px/1 Baloo;color:#e0102a;min-width:130px}
.row .tx{font:800 52px/1.2 Baloo;color:#111;flex:1}
.row .tx small{display:block;font:600 32px Hind;color:#555}
.ico{width:120px;height:120px}

#cap{position:absolute;z-index:100;left:60px;width:960px;top:1352px;min-height:200px;background:rgba(24,24,30,.94);border:2px solid rgba(255,255,255,.08);border-radius:26px;padding:26px 34px 20px;text-align:center;font:600 47px/1.48 Hind;color:#8c8c96;box-shadow:0 18px 40px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
#cap span{transition:none}
#cap .p{color:#fff}
#cap .k{color:#ffc414}
#cap .c{color:#ffc414}
#prog{position:absolute;z-index:100;left:60px;width:960px;top:1616px;height:6px;border-radius:3px;background:rgba(140,140,140,.35)}
#prog i{position:absolute;left:0;top:0;bottom:0;background:#ffc414;border-radius:3px}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div>
<script src="assets/words.js"></script>
<script>
/* ======================== CONFIG ======================== */
const BRAND = 'DIGITAL DESK';        // header label (change to your channel name)
const BRAND_WORD = 'Digital Desk';   // footer wordmark
const BRAND_TAG = 'সহজ ভাষায় খবরের ভেতরের খবর';
const TAIL = 1.4;                    // seconds after the voice ends
const DURATION = WORDS.duration + TAIL;

/* ======================== WORD TIMING ======================== */
const WL = WORDS.words;
const clean = s => s.replace(/[,!?।.]/g, '');
// start time of the first word containing `txt` at/after time `after`
function at(txt, after = 0) {
  const w = WL.find(w => w.s >= after - 0.01 && (clean(w.w) === txt || clean(w.w).includes(txt)));
  if (!w) { console.warn('word not found', txt, after); return after; }
  return w.s;
}
function endOf(txt, after = 0) { const w = WL.find(w => w.s >= after - 0.01 && clean(w.w).includes(txt)); return w ? w.e : after; }

/* ======================== EASING ======================== */
const cl = v => Math.max(0, Math.min(1, v));
const E = {
  lin: p => p,
  out: p => 1 - Math.pow(1 - p, 3),
  out5: p => 1 - Math.pow(1 - p, 5),
  io: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  back: p => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  el: p => p === 0 ? 0 : p === 1 ? 1 : Math.pow(2, -9 * p) * Math.sin((p * 10 - .75) * (2 * Math.PI / 3)) + 1,
};
const lerp = (a, b, p) => a + (b - a) * p;

/* ======================== ANIMATION TYPES ======================== */
// each returns props for progress p (0..1). additive types are applied only while active.
const ANIM = {
  pop:   p => ({ s: Math.max(0, E.back(p)), o: cl(p * 4) }),
  popel: p => ({ s: Math.max(0, E.el(p)), o: cl(p * 5) }),
  fade:  p => ({ o: E.out(p) }),
  up:    (p, o) => ({ y: (1 - E.out(p)) * (o.d || 90), o: cl(p * 2) }),
  down:  (p, o) => ({ y: -(1 - E.out(p)) * (o.d || 90), o: cl(p * 2) }),
  fromL: (p, o) => ({ x: -(1 - E.out5(p)) * (o.d || 900), o: cl(p * 3) }),
  fromR: (p, o) => ({ x: (1 - E.out5(p)) * (o.d || 900), o: cl(p * 3) }),
  stamp: (p, o) => ({ s: lerp(o.from || 2.6, 1, E.out5(p)), o: cl(p * 3), r: o.r || 0 }),
  out:   p => ({ o: 1 - E.out(p), s: 1 - .12 * E.out(p) }),
  outUp: p => ({ o: 1 - E.out(p), y: -70 * E.out(p) }),
  wipe:  p => ({ clip: E.io(p) }),
  draw:  p => ({ dash: E.io(p) }),
  to:    (p, o) => { const e = (o.ease || E.io)(p), r = {}; for (const k in o.to) r[k] = lerp(o.from[k], o.to[k], e); return r; },
  count: (p, o) => ({ num: lerp(o.from || 0, o.to, E.out(p)) }),
  // additive
  shake:  (p, o) => ({ x: Math.sin(p * 55) * (o.a || 22) * (1 - p), _add: 1 }),
  wobble: (p, o) => ({ r: Math.sin(p * Math.PI * 5) * (o.a || 9) * (1 - p), _add: 1 }),
  pulse:  (p, o) => ({ s: Math.sin(p * Math.PI) * (o.a || .1), _add: 1 }),
  float:  (p, o) => ({ y: Math.sin(p * Math.PI * 2 * (o.n || 2)) * (o.a || 10), _add: 1 }),
  spin:   (p, o) => ({ r: p * (o.a || 360), _add: 1 }),
};
const ADDITIVE = new Set(['shake', 'wobble', 'pulse', 'float', 'spin']);

/* ======================== SCENE GRAPH ======================== */
const stage = document.getElementById('stage');
const SCENES = [], NODES = [], SFX = [];
const BN = n => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
let curScene = null;

function sfx(t, type, vol = 1) { SFX.push({ t: +t.toFixed(3), type, vol }); }

function scene(start, theme, num) {
  const root = document.createElement('div');
  root.className = 'scene ' + theme;
  root.innerHTML = `<div class="wm">${BN(num)}</div>
    <div class="hdr"><span class="b">${BRAND}</span><span class="n">${BN(String(num).padStart(2,'0'))} / ${BN(13)}</span></div>
    <div class="foot"><div class="w">${BRAND_WORD}<i>.</i></div><div class="t">${BRAND_TAG}</div></div>`;
  stage.appendChild(root);
  const s = { start, theme, num, root };
  SCENES.push(s); curScene = s;
  if (start > 0) sfx(start - 0.05, 'whoosh', .55);
  return s;
}

// add element. pos: {x,y} = anchor point; anchor 'c' (center) or 'l' (left-middle) or 'lt'
function add(html, x, y, opt = {}) {
  const el = document.createElement('div');
  el.className = 'a ' + (opt.cls || '');
  el.innerHTML = html;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  if (opt.w) el.style.width = opt.w + 'px';
  if (opt.css) el.style.cssText += opt.css;
  (opt.parent || curScene.root).appendChild(el);
  const n = { el, tw: [], anchor: opt.anchor || 'c', z: opt.z };
  if (opt.z) el.style.zIndex = opt.z;
  NODES.push(n);
  el._n = n;
  return n;
}
// tween: A(node, type, t0, dur, opts)
function A(n, type, t0, dur = .5, o = {}) { n.tw.push({ type, t0, dur, o }); n.tw.sort((a, b) => a.t0 - b.t0); return n; }

function applyNode(n, t) {
  const st = { x: 0, y: 0, s: 1, r: 0, o: 1, clip: 1, dash: 1, num: null };
  const touched = new Set(); const addv = { x: 0, y: 0, s: 0, r: 0 };
  for (const tw of n.tw) {
    const p = cl((t - tw.t0) / tw.dur);
    if (ADDITIVE.has(tw.type)) {
      if (t >= tw.t0 && t <= tw.t0 + tw.dur) { const v = ANIM[tw.type](p, tw.o); for (const k in v) if (k !== '_add') addv[k] += v[k]; }
      continue;
    }
    const v = ANIM[tw.type](p, tw.o);
    for (const k in v) { if (t >= tw.t0 || !touched.has(k)) st[k] = v[k]; touched.add(k); }
  }
  const el = n.el;
  const x = st.x + addv.x, y = st.y + addv.y, s = st.s + addv.s, r = st.r + addv.r;
  const base = n.anchor === 'c' ? 'translate(-50%,-50%) ' : n.anchor === 'l' ? 'translate(0,-50%) ' : '';
  el.style.transform = `${base}translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;
  el.style.opacity = st.o;
  el.style.visibility = st.o <= 0.001 ? 'hidden' : 'visible';
  el.style.clipPath = st.clip < 1 ? `inset(-20% ${(1 - st.clip) * 100}% -20% -2%)` : 'none';
  if (n.paths) for (const p of n.paths) p.style.strokeDashoffset = 1 - st.dash;
  if (st.num !== null && n.fmt) n.numEl.textContent = n.fmt(st.num);
}

/* ======================== GRAPHICS ======================== */
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function qrSVG(size, color = '#0b7a35', seed = 7, mid = true) {
  const N = 25, r = rng(seed), m = size / N; let out = '';
  const inF = (i, j) => (i < 8 && j < 8) || (i > N - 9 && j < 8) || (i < 8 && j > N - 9);
  const inMid = (i, j) => mid && i > 8 && i < 16 && j > 9 && j < 15;
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    if (inF(i, j) || inMid(i, j)) continue;
    if (r() > .52) out += `<rect x="${i * m}" y="${j * m}" width="${m + .4}" height="${m + .4}" rx="${m * .18}"/>`;
  }
  const fp = (x, y) => `<rect x="${x * m + m / 2}" y="${y * m + m / 2}" width="${6 * m}" height="${6 * m}" rx="${m * 1.2}" fill="none" stroke="${color}" stroke-width="${m}"/><rect x="${(x + 2) * m}" y="${(y + 2) * m}" width="${3 * m}" height="${3 * m}" rx="${m * .5}"/>`;
  const midBox = mid ? `<rect x="${9.3 * m}" y="${10.2 * m}" width="${6.4 * m}" height="${4.6 * m}" rx="${m}" fill="#fff" stroke="#e0102a" stroke-width="${m * .55}"/><text x="${12.5 * m}" y="${13.65 * m}" text-anchor="middle" font-family="Baloo" font-weight="800" font-size="${3.2 * m}" fill="#e0102a">QR</text>` : '';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" fill="${color}">${out}${fp(0, 0)}${fp(N - 7, 0)}${fp(0, N - 7)}${midBox}</svg>`;
}
// Bangla QR style card
function bqr(size, shadow = '#0b7a35') {
  const q = size * .78;
  return `<div class="card" style="width:${size}px;padding:${size * .07}px ${size * .08}px ${size * .09}px;box-shadow:${size * .045}px ${size * .045}px 0 ${shadow};display:flex;flex-direction:column;align-items:center">
    <div style="font:800 ${size * .15}px/1.1 Baloo;color:#e0102a;letter-spacing:1px;margin-bottom:${size * .02}px">বাংলা <span style="color:#0b7a35">QR</span></div>
    ${qrSVG(q, '#0b7a35', 11)}</div>`;
}
function tile(name, bg, sub = '', size = 250, icon = '') {
  return `<div class="card tile" style="width:${size}px;height:${size}px;padding:${size * .065}px;box-shadow:${size * .055}px ${size * .055}px 0 #111;border-radius:${size * .15}px">
    <div class="in" style="background:${bg};font-size:${size * .25}px;border-radius:${size * .09}px">${icon}${name}${sub ? `<small style="font-size:${size * .11}px">${sub}</small>` : ''}</div></div>`;
}
const IC = {
  bank: (c = '#fff', s = 90) => `<svg width="${s}" height="${s}" viewBox="0 0 64 64" fill="${c}"><path d="M32 6 4 20v6h56v-6z"/><rect x="9" y="29" width="7" height="22" rx="1.5"/><rect x="22" y="29" width="7" height="22" rx="1.5"/><rect x="35" y="29" width="7" height="22" rx="1.5"/><rect x="48" y="29" width="7" height="22" rx="1.5"/><rect x="4" y="53" width="56" height="7" rx="2"/></svg>`,
  phone: (c = '#fff', s = 90) => `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><rect x="16" y="4" width="32" height="56" rx="7" fill="${c}"/><rect x="20" y="11" width="24" height="38" rx="2" fill="rgba(0,0,0,.25)"/><circle cx="32" cy="54" r="2.6" fill="rgba(0,0,0,.35)"/></svg>`,
  warn: (s = 150) => `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><path d="M32 5 61 57H3z" fill="#ffc414" stroke="#111" stroke-width="4" stroke-linejoin="round"/><rect x="29" y="22" width="6" height="20" rx="3" fill="#111"/><circle cx="32" cy="49" r="3.6" fill="#111"/></svg>`,
  check: (s = 120, c = '#14a44d') => `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="${c}" stroke="#111" stroke-width="4"/><path d="M18 33l9 9 19-20" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="dp"/></svg>`,
  cross: (s = 120) => `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="#e0102a" stroke="#111" stroke-width="4"/><path d="M21 21l22 22M43 21 21 43" stroke="#fff" stroke-width="7" stroke-linecap="round"/></svg>`,
  mag: (s = 200, c = '#111') => `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><circle cx="26" cy="26" r="17" fill="rgba(255,255,255,.25)" stroke="${c}" stroke-width="6"/><path d="M39 39l18 18" stroke="${c}" stroke-width="9" stroke-linecap="round"/></svg>`,
  angry: (s = 260) => `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><circle cx="32" cy="32" r="29" fill="#ffc414" stroke="#111" stroke-width="3.5"/><path d="M16 22l11 5M48 22l-11 5" stroke="#111" stroke-width="4" stroke-linecap="round"/><circle cx="23" cy="31" r="3.6" fill="#111"/><circle cx="41" cy="31" r="3.6" fill="#111"/><path d="M20 48q12-10 24 0" fill="none" stroke="#111" stroke-width="4.5" stroke-linecap="round"/><path d="M50 8c4 2 6 6 5 10" stroke="#e0102a" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>`,
  scale: (s = 100, c = '#111') => `<svg width="${s}" height="${s}" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8v48M18 56h28M10 16h44"/><path d="M10 16 3 34h14zM54 16l-7 18h14z" fill="${c}"/></svg>`,
  refund: (s = 100, c = '#111') => `<svg width="${s}" height="${s}" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M50 22A21 21 0 1 0 53 38"/><path d="M52 8v15H37"/><text x="32" y="41" text-anchor="middle" font-family="Hind" font-weight="700" font-size="24" fill="${c}" stroke="none">৳</text></svg>`,
  bolt: (s = 100) => `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><path d="M37 3 9 37h20l-4 24 30-36H35z" fill="#ffc414" stroke="#111" stroke-width="4" stroke-linejoin="round"/></svg>`,
  store: (s = 110, c = '#e0102a') => `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><rect x="8" y="26" width="48" height="32" rx="3" fill="#fff" stroke="#111" stroke-width="4"/><path d="M6 12h52l2 14H4z" fill="${c}" stroke="#111" stroke-width="4" stroke-linejoin="round"/><path d="M19 12l-3 14M32 12v14M45 12l3 14" stroke="#fff" stroke-width="4"/><rect x="25" y="38" width="14" height="20" fill="#111"/></svg>`,
  chat: (s = 260) => `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><path d="M8 8h48a4 4 0 0 1 4 4v30a4 4 0 0 1-4 4H26L14 58V46H8a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4z" fill="#14a44d"/><circle cx="20" cy="27" r="4.5" fill="#fff"/><circle cx="32" cy="27" r="4.5" fill="#fff"/><circle cx="44" cy="27" r="4.5" fill="#fff"/></svg>`,
  arrowUp: (s = 120, c = '#14a44d') => `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><path d="M32 4 56 30H42v30H22V30H8z" fill="${c}" stroke="#111" stroke-width="4" stroke-linejoin="round"/></svg>`,
  arrowDn: (s = 120, c = '#e0102a') => `<svg width="${s}" height="${s}" viewBox="0 0 64 64"><path d="M32 60 8 34h14V4h20v30h14z" fill="${c}" stroke="#111" stroke-width="4" stroke-linejoin="round"/></svg>`,
